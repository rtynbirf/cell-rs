# Кровь: пульс клетки cell-rs — ПЕРВАЯ Rust-клетка в живой цепи крови.
# Запуск — ТОЛЬКО событие (repository_dispatch от polymath-os), не таймер
# (закон 1: угадчик — яд).
#
# Волна ×9 «рой из модели в кровь» + ADR-0005 «тропа роя»: конверт сверяется
# ВТОРЫМ ЯЗЫКОМ ДО эха — Rust-гейт blood_gate верифицирует ВСЮ клеточную
# летопись по байтам (sha256/std-only) и требование запечатанности конверта;
# подделка останавливает кровь раньше Python-ядра. Затем — эхо в летопись
# (vendored kernel runtime-protocol) и передача крови voice-atlas-llm
# (конец пульса).
name: blood

permissions:
  contents: read

on:
  repository_dispatch:
    types: [blood-pulse]
  workflow_dispatch:

jobs:
  beat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: самотест гейта на золотых пробах (офлайн)
        run: cargo run --release --bin blood_gate -- --self-test

      - name: конверт из dispatch → файл
        if: ${{ github.event_name == 'repository_dispatch' }}
        env:
          BLOOD_ENVELOPE: ${{ toJson(github.event.client_payload.envelope) }}
        run: |
          printf '%s' "$BLOOD_ENVELOPE" > /tmp/envelope.json
          wc -c /tmp/envelope.json

      - name: клеточная летопись живьём → файл
        if: ${{ github.event_name == 'repository_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.CELL_SWARM_DISPATCH_TOKEN }}
        run: |
          CODE=$(curl -sS -o /tmp/ledger.jsonl -w '%{http_code}' \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.raw" \
            https://api.github.com/repos/rtynbirf/cell-swarm/contents/blood/CELLS-LEDGER.jsonl?ref=main) || CODE=000
          echo "ФАКТ: летопись скачана: HTTP $CODE, строк $(wc -l < /tmp/ledger.jsonl)"
          [ "$CODE" = "200" ] || { cat /tmp/ledger.jsonl; exit 1; }

      - name: Rust-гейт — сверка крови вторым языком (fail-closed)
        if: ${{ github.event_name == 'repository_dispatch' }}
        run: |
          cargo run --release --bin blood_gate -- \
            --ledger /tmp/ledger.jsonl \
            --envelope /tmp/envelope.json \
            --cell cell-rs \
            --cell-sha "$GITHUB_SHA"

      - name: эхо в летопись + сборка тела для voice-atlas-llm
        if: ${{ github.event_name == 'repository_dispatch' }}
        env:
          BLOOD_ENVELOPE: ${{ toJson(github.event.client_payload.envelope) }}
          CELL_NAME: cell-rs
          CELL_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.CELL_SWARM_DISPATCH_TOKEN }}
        run: python3 tooling/blood/kernel/blood_cell.py --next-repo rtynbirf/voice-atlas-llm --next-output /tmp/next_dispatch.json

      - name: ручной прогон — сверка летописи живьём (кровь вслепую не льётся)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CELL_NAME: cell-rs
          CELL_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.CELL_SWARM_DISPATCH_TOKEN }}
        run: python3 tooling/blood/kernel/blood_cell.py --manual-check

      - name: кровь идёт дальше — dispatch → voice-atlas-llm (конец пульса)
        if: ${{ github.event_name == 'repository_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.CELL_SWARM_DISPATCH_TOKEN }}
        run: |
          if [ ! -s /tmp/next_dispatch.json ]; then
            echo "dispatch-тело не собрано (этап эха не прошёл) — цепь остановлена честно"
            exit 1
          fi
          CODE=$(curl -sS -o /tmp/next.json -w '%{http_code}' -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/rtynbirf/voice-atlas-llm/dispatches \
            -d @/tmp/next_dispatch.json) || CODE=000
          echo "ФАКТ: dispatch voice-atlas-llm: HTTP $CODE (204=кровь дошла до конца пульса)"
          [ "$CODE" = "204" ] || { cat /tmp/next.json; exit 1; }
